<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Levanta Max</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    html{
        scroll-behavior:smooth;
    }

    body{
        font-family:'Inter',sans-serif;
        background:linear-gradient(180deg,#0d0d0d 0%,#171717 100%);
        color:#fff;
        line-height:1.4;
    }

    a{
        text-decoration:none;
    }

    .header-line{
        width:100%;
        padding:18px 14px;
        text-align:center;
        background:linear-gradient(90deg,#111,#1d1d1d,#111);
        border-bottom:1px solid rgba(255,255,255,0.08);
        box-shadow:0 8px 24px rgba(0,0,0,0.22);
        position:sticky;
        top:0;
        z-index:100;
        backdrop-filter:blur(8px);
    }

    .title-line{
        font-size:1.8rem;
        font-weight:900;
        letter-spacing:2px;
        color:#f5c542;
   } 

    .container{
        max-width:860px;
        margin:0 auto;
        padding:18px 16px 34px;
    }

    .hero{
        display:flex;
        flex-direction:column;
        align-items:center;
        text-align:center;
        gap:14px;
        padding-top:2px;
    }

    .headline{
        font-size:1.95rem;
        font-weight:800;
        line-height:1.08;
        margin-bottom:2px;
    }

    .headline span{
        color:#f5c542;
    }

    .hero-image{
        width:100%;
        display:flex;
        justify-content:center;
        align-items:center;
        margin-top:2px;
    }

    .product-frame{
        width:100%;
        max-width:360px;
        background:rgba(255,255,255,0.04);
        border:1px solid rgba(255,255,255,0.08);
        border-radius:22px;
        padding:14px 14px 8px;
        box-shadow:0 18px 40px rgba(0,0,0,0.28);
        display:flex;
        justify-content:center;
        align-items:center;
        overflow:hidden;
    }

    .product-image{
        width:100%;
        max-width:220px;
        height:auto;
        object-fit:contain;
        display:block;
        filter:drop-shadow(0 14px 26px rgba(0,0,0,0.40));
    }

    .cta-section{
        width:100%;
        display:flex;
        justify-content:center;
        margin-top:2px;
    }

    .whatsapp-button{
        width:100%;
        max-width:420px;
        border:none;
        border-radius:16px;
        background:linear-gradient(90deg,#25D366,#1faa52);
        color:#fff;
        font-size:0.98rem;
        font-weight:800;
        padding:16px 18px;
        cursor:pointer;
        display:inline-flex;
        align-items:center;
        justify-content:center;
        gap:10px;
        box-shadow:0 12px 30px rgba(37,211,102,0.26);
        transition:transform 0.2s ease, box-shadow 0.2s ease;
        animation:pulseButton 1.8s infinite;
    }

    .whatsapp-button:hover{
        transform:translateY(-2px);
        box-shadow:0 16px 34px rgba(37,211,102,0.33);
    }

    @keyframes pulseButton{
        0%{
            transform:scale(1);
            box-shadow:0 0 0 0 rgba(37,211,102,0.45), 0 12px 30px rgba(37,211,102,0.22);
        }
        70%{
            transform:scale(1.03);
            box-shadow:0 0 0 14px rgba(37,211,102,0), 0 14px 34px rgba(37,211,102,0.30);
        }
        100%{
            transform:scale(1);
            box-shadow:0 0 0 0 rgba(37,211,102,0), 0 12px 30px rgba(37,211,102,0.22);
        }
    }

    .benefits{
        display:flex;
        flex-direction:column;
        gap:10px;
        width:100%;
        max-width:680px;
        margin-top:12px;
    }

    .benefit-item{
        display:flex;
        align-items:center;
        justify-content:center;
        gap:10px;
        padding:14px 16px;
        border-radius:18px;
        background:rgba(255,255,255,0.05);
        border:1px solid rgba(255,255,255,0.08);
        font-weight:700;
        font-size:1rem;
        color:#f2f2f2;
    }

    .benefit-item i{
        color:#f5c542;
        font-size:1rem;
    }

    .info-strip{
        margin-top:14px;
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:12px;
        width:100%;
        max-width:680px;
    }

    .info-card{
        background:rgba(255,255,255,0.05);
        border:1px solid rgba(255,255,255,0.08);
        border-radius:18px;
        padding:14px 14px;
        text-align:center;
        font-weight:700;
        font-size:0.95rem;
    }

    .info-card.highlight{
        background:linear-gradient(90deg,#f5c542,#ffd86b);
        color:#111;
        border:none;
    }

    .pricing-section{
        margin-top:22px;
    }

    .pricing-card{
        max-width:560px;
        margin:0 auto;
        padding:26px 18px;
        background:linear-gradient(180deg,rgba(255,255,255,0.06),rgba(255,255,255,0.03));
        border:1px solid rgba(245,197,66,0.16);
        border-radius:22px;
        text-align:center;
        box-shadow:0 16px 35px rgba(0,0,0,0.28);
    }

    .pricing-title{
        font-size:1.3rem;
        font-weight:900;
        color:#f5c542;
        margin-bottom:16px;
    }

    .pricing-option.installment{
        display:flex;
        align-items:baseline;
        justify-content:center;
        gap:8px;
        margin-bottom:8px;
    }

    .installment-text{
        font-size:1.1rem;
        font-weight:800;
    }

    .installment-value{
        font-size:2.3rem;
        font-weight:900;
        color:#25D366;
        line-height:1;
    }

    .installment-subtitle{
        display:block;
        font-size:0.9rem;
        color:#cfcfcf;
        font-weight:600;
    }

    .pricing-divider{
        margin:16px 0 10px;
        color:#bdbdbd;
        font-weight:700;
    }

    .cash-value{
        font-size:1.8rem;
        font-weight:900;
        color:#f5c542;
    }

    .footer-space{
        height:26px;
    }

    @media (max-width: 768px){
        .title-line{
            font-size:1.55rem;
        }

        .container{
            padding:14px 14px 28px;
        }

        .hero{
            gap:12px;
        }

        .headline{
            font-size:1.65rem;
            line-height:1.08;
        }

        .product-frame{
            max-width:100%;
            padding:10px 10px 4px;
            border-radius:20px;
        }

        .product-image{
            max-width:180px;
        }

        .whatsapp-button{
            max-width:100%;
            font-size:0.93rem;
            padding:15px 14px;
        }

        .benefit-item{
            font-size:0.95rem;
            padding:13px 12px;
        }

        .info-strip{
            grid-template-columns:1fr;
            gap:10px;
        }

        .info-card{
            font-size:0.92rem;
            padding:13px 12px;
        }

        .pricing-card{
            padding:22px 16px;
        }

        .pricing-title{
            font-size:1.15rem;
        }

        .installment-value{
            font-size:2rem;
        }

        .cash-value{
            font-size:1.65rem;
        }
    }
</style>
</head>
<body>
    <header class="header-line">
        <h1 class="title-line">LEVANTA MAX</h1>
    </header>

    <main class="container">
        <section class="hero">
            <h2 class="headline">
                Você ainda é o mesmo homem.<br>
                <span>Ganhe mais confiança no dia a dia.</span>
            </h2>

            <div class="hero-image">
                <div class="product-frame">
                    <img src="assets/produto.png" alt="Imagem do produto Levanta Max" class="product-image">
                </div>
            </div>

            <div class="cta-section">
                <button class="whatsapp-button" onclick="window.open('https://wa.me/557399497833?text=Ol%C3%A1%2C%20gostaria%20de%20mais%20informa%C3%A7%C3%B5es%20sobre%20o%20Levanta%20Max', '_blank')">
                    <i class="fab fa-whatsapp"></i>
                    <span>QUERO MEU LEVANTA MAX</span>
                </button>
            </div>

            <div class="benefits">
                <div class="benefit-item">
                    <i class="fas fa-bolt"></i>
                    <span>Mais energia</span>
                </div>

                <div class="benefit-item">
                    <i class="fas fa-heart"></i>
                    <span>Autoestima Elevada</span>
                </div>

                <div class="benefit-item">
                    <i class="fas fa-fire"></i>
                    <span>Performance Máxima</span>
                </div>
            </div>

            <div class="info-strip">
                <div class="info-card">100% Natural • Satisfação Garantida</div>
                <div class="info-card highlight">Pague somente na entrega</div>
            </div>
        </section>

        <section class="pricing-section">
            <div class="pricing-card">
                <h2 class="pricing-title">TRATAMENTO DE 1 MÊS</h2>

                <div class="pricing-option installment">
                    <span class="installment-text">12x</span>
                    <span class="installment-value">18,93</span>
                </div>

                <span class="installment-subtitle">NO CARTÃO</span>

                <div class="pricing-divider">OU À VISTA:</div>

                <div class="pricing-option cash">
                    <span class="cash-value">R$ 183</span>
                </div>

                <div class="cta-section" style="margin-top:18px;">
                    <button class="whatsapp-button" onclick="window.open('https://wa.me/557399497833?text=Ol%C3%A1%2C%20gostaria%20de%20mais%20informa%C3%A7%C3%B5es%20sobre%20o%20Levanta%20Max', '_blank')">
                        <i class="fab fa-whatsapp"></i>
                        <span>QUERO MEU LEVANTA MAX</span>
                    </button>
                </div>
            </div>
        </section>

        <div class="footer-space"></div>
    </main>
</body>
</html>
